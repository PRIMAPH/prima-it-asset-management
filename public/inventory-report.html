<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inventory Report - PRIMA IT Asset Management</title>
  <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/inventory-report.css?v=1">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png">
</head>
<body>
  <div class="report-toolbar" aria-label="Report actions">
    <button id="printInventoryReportBtn" type="button" class="btn btn-primary">
      <i class="bi bi-printer me-1" aria-hidden="true"></i>Print / Save PDF
    </button>
    <a id="exportInventoryReportBtn" class="btn btn-outline-primary" href="#">
      <i class="bi bi-file-earmark-excel me-1" aria-hidden="true"></i>Export Excel
    </a>
    <button type="button" class="btn btn-secondary" onclick="window.close()">Close</button>
  </div>

  <main id="inventoryReport" class="report-page" aria-live="polite">
    <div id="inventoryReportLoading" class="report-loading">Loading inventory report...</div>
  </main>

  <script src="/js/inventory-report.js?v=1"></script>
</body>
</html>
