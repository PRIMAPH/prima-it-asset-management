<script>

const $ =
  id =>
    document.getElementById(id);


function esc(value) {

  return String(
    value ?? ''
  )
    .replaceAll(
      '&',
      '&amp;'
    )
    .replaceAll(
      '<',
      '&lt;'
    )
    .replaceAll(
      '>',
      '&gt;'
    )
    .replaceAll(
      '"',
      '&quot;'
    )
    .replaceAll(
      "'",
      '&#039;'
    );

}


function value(v) {

  if (
    v === null ||
    v === undefined ||
    String(v).trim() === ''
  ) {

    return '—';

  }


  return esc(v);

}


function money(value) {

  return Number(
    value || 0
  )
    .toLocaleString(
      'en-PH',
      {
        style:
          'currency',

        currency:
          'PHP',

        minimumFractionDigits:
          2
      }
    );

}


function dateValue(value) {

  if (!value) {

    return '—';

  }


  const date =
    new Date(
      String(value)
        .replace(
          ' ',
          'T'
        )
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return esc(value);

  }


  return date.toLocaleString(
    'en-PH',
    {
      year:
        'numeric',

      month:
        'short',

      day:
        '2-digit',

      hour:
        '2-digit',

      minute:
        '2-digit'
    }
  );

}


const CODE128_PATTERNS = [
  '212222', '222122', '222221', '121223', '121322', '131222',
  '122213', '122312', '132212', '221213', '221312', '231212',
  '112232', '122132', '122231', '113222', '123122', '123221',
  '223211', '221132', '221231', '213212', '223112', '312131',
  '311222', '321122', '321221', '312212', '322112', '322211',
  '212123', '212321', '232121', '111323', '131123', '131321',
  '112313', '132113', '132311', '211313', '231113', '231311',
  '112133', '112331', '132131', '113123', '113321', '133121',
  '313121', '211331', '231131', '213113', '213311', '213131',
  '311123', '311321', '331121', '312113', '312311', '332111',
  '314111', '221411', '431111', '111224', '111422', '121124',
  '121421', '141122', '141221', '112214', '112412', '122114',
  '122411', '142112', '142211', '241211', '221114', '413111',
  '241112', '134111', '111242', '121142', '121241', '114212',
  '124112', '124211', '411212', '421112', '421211', '212141',
  '214121', '412121', '111143', '111341', '131141', '114113',
  '114311', '411113', '411311', '113141', '114131', '311141',
  '411131', '211412', '211214', '211232', '2331112'
];


function renderCode128Barcode(
  svg,
  rawValue
) {

  if (!svg) {
    return;
  }


  const barcodeValue =
    String(rawValue || '')
      .trim();


  const dataCodes =
    Array.from(barcodeValue)
      .map(
        character =>
          character.charCodeAt(0) - 32
      );


  const isValid =
    barcodeValue.length > 0 &&
    dataCodes.every(
      code =>
        code >= 0 &&
        code <= 94
    );


  if (!isValid) {
    svg.hidden = true;
    svg.replaceChildren();
    return;
  }


  const startCode = 104;

  const checksum =
    (
      startCode +
      dataCodes.reduce(
        (total, code, index) =>
          total +
          code *
          (index + 1),
        0
      )
    ) % 103;


  const encodedPatterns = [
    startCode,
    ...dataCodes,
    checksum,
    106
  ]
    .map(
      code =>
        CODE128_PATTERNS[code]
    );


  const quietZone = 10;

  const barcodeWidth =
    encodedPatterns.reduce(
      (total, pattern) =>
        total +
        Array.from(pattern)
          .reduce(
            (width, digit) =>
              width + Number(digit),
            0
          ),
      quietZone * 2
    );


  const svgNamespace =
    'http://www.w3.org/2000/svg';

  const fragment =
    document.createDocumentFragment();

  let x =
    quietZone;


  encodedPatterns.forEach(
    pattern => {

      Array.from(pattern)
        .forEach(
          (digit, index) => {

            const width =
              Number(digit);


            if (index % 2 === 0) {

              const bar =
                document.createElementNS(
                  svgNamespace,
                  'rect'
                );

              bar.setAttribute(
                'x',
                String(x)
              );

              bar.setAttribute(
                'y',
                '0'
              );

              bar.setAttribute(
                'width',
                String(width)
              );

              bar.setAttribute(
                'height',
                '60'
              );

              bar.setAttribute(
                'fill',
                '#000'
              );

              fragment.appendChild(
                bar
              );

            }


            x += width;

          }
        );

    }
  );


  svg.setAttribute(
    'viewBox',
    `0 0 ${barcodeWidth} 60`
  );

  svg.setAttribute(
    'preserveAspectRatio',
    'xMidYMid meet'
  );

  svg.setAttribute(
    'aria-label',
    `Barcode for ${barcodeValue}`
  );

  svg.dataset.checksum =
    String(checksum);

  svg.hidden = false;
  svg.replaceChildren(fragment);

}


async function loadRepair() {

  const params =
    new URLSearchParams(
      location.search
    );


  const repairId =
    Number(
      params.get('id') ||
      0
    );


  if (!repairId) {

    showError(
      'Invalid Repair Job Order ID.'
    );

    return;

  }


  try {

    const response =
      await fetch(
        `/api/repairs/${repairId}`,
        {
          credentials:
            'include',

          headers: {
            'Accept':
              'application/json'
          }
        }
      );


    const repair =
      await response
        .json()
        .catch(
          () => ({})
        );


    if (!response.ok) {

      throw new Error(
        repair.message ||
        'Unable to load repair record.'
      );

    }


    renderRepair(
      repair
    );


  } catch (error) {

    console.error(
      'LOAD REPAIR JOB ORDER ERROR:',
      error
    );


    showError(
      error.message ||
      'Unable to load Repair Job Order.'
    );

  }

}


function showError(message) {

  $('loading').style.display =
    'none';


  $('errorBox').style.display =
    'block';


  $('errorBox').textContent =
    message;

}
