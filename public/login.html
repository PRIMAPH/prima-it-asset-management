<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRIMA IT Asset Management - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css?v=6">
  <script src="/js/alerts.js?v=2"></script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png">
</head>
<body class="login-page">
  <div class="login-card card shadow-sm">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="login-company-logo-panel">
          <img
            class="login-company-logo"
            src="/images/prima-company-logo.png"
            alt="Prima Fintech"
            width="229"
            height="38"
          >
        </div>
        <div class="text-muted mt-2">IT Asset Management</div>
      </div>
      <div id="alertBox"></div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label" for="username">Username / Employee ID</label>
          <input id="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input id="password" type="password" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100">Login</button>
      </form>
    </div>
  </div>
  <script src="/js/login.js?v=2"></script>
</body>
</html>
